name: CI

on:
  workflow_dispatch:
    inputs:
      runtime_image:
        description: Run separately approved codec-bearing runtime image acceptance
        type: boolean
        required: false
        default: false
      android_smoke:
        description: Compile isolated non-production Android debug application
        type: boolean
        required: false
        default: false
      android_probe:
        description: Inspect preinstalled Android emulator prerequisites without installing or changing permissions
        type: boolean
        required: false
        default: false
      android_execute:
        description: Exercise synthetic Android storage and app links in a new software-only emulator
        type: boolean
        required: false
        default: false
      android_accelerated:
        description: Run Android execution with specifically approved temporary KVM user access and restore it afterward
        type: boolean
        required: false
        default: false
      ios_smoke:
        description: Compile isolated non-production iOS Simulator debug application
        type: boolean
        required: false
        default: false
      ios_execute:
        description: Exercise synthetic storage and Arabic UI in a new disposable iOS Simulator
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-emulator-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect installed SDK images and current acceleration access
        run: python3 integration/android-emulator-preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: onlinu-android-emulator-preflight-${{ github.sha }}
          path: artifacts/android-emulator-preflight/report.json
          if-no-files-found: error
          retention-days: 3
  control-image:
    name: control-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated control runtime image
        run: docker build -f prototype/platform/Dockerfile.control -t onlinu-control:test prototype/platform
      - name: Verify non-root runtime modules
        run: |
          docker run --rm --entrypoint node onlinu-control:test --input-type=module -e "import './control-server.mjs'; if (process.getuid() === 0) throw new Error('root runtime'); console.log('Runtime imports and non-root user verified');"

  server:
    name: server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CGO_ENABLED: "0"
      TEST_RESTAURANT_PG_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_restaurant_test?sslmode=disable
      TEST_META_PG_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_meta_test?sslmode=disable
      TENANT_TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_tenant_prototype_test?sslmode=disable
      CHANNELS_TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_channels_prototype_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_oauth_refresh_test?sslmode=disable
      IDENTITY_TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_identity_test?sslmode=disable
      TEST_CORE_ADAPTER: "1"
      TEST_RUNTIME_MAIN: "1"
      CORE_BROWSER_TEST: "1"
      CORE_DELIVERY_SCREENSHOT: ${{ github.workspace }}/artifacts/delivery-location/browser.png
      CORE_PROVISIONING_SCREENSHOT: ${{ github.workspace }}/artifacts/provisioning/browser.png
      CORE_OPENING_SCREENSHOT: ${{ github.workspace }}/artifacts/opening-schedule/browser.png
      CORE_PAYMENT_METHODS_SCREENSHOT: ${{ github.workspace }}/artifacts/payment-methods/browser.png
    steps:
      - uses: actions/checkout@v4

      - name: Test deployment planning and safety guards
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v

      - name: Validate rendered tenant Compose schema without deployment
        run: python3 integration/check-tenant-compose.py

      - name: Set up Node for core adapter integration
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/platform/package-lock.json

      - name: Test provisioning cancellation safety guards
        run: node --test integration/provisioning-cancellation-guards.test.mjs

      - name: Install platform test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototype/platform

      - name: Test journal and Docker fixture guards
        run: node --test prototype/platform/integration/provisioning-docker-guards.test.mjs

      - name: Install checksum-pinned Flutter for native HTTP integration
        working-directory: prototype/admin_flutter
        env:
          CI: "true"
          BOT: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
        run: |
          archive="$RUNNER_TEMP/flutter-linux-3.47.5.tar.xz"
          curl -fsSL --retry 2 --max-time 600 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz -o "$archive"
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/onlinu-native-sdk"
          tar -xJf "$archive" -C "$RUNNER_TEMP/onlinu-native-sdk"
          sdk="$RUNNER_TEMP/onlinu-native-sdk/flutter"
          "$sdk/bin/flutter" --suppress-analytics pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock windows/flutter/generated_plugin_registrant.cc windows/flutter/generated_plugins.cmake
          echo "CORE_FLUTTER_TEST_BIN=$sdk/bin/flutter" >> "$GITHUB_ENV"

      - name: Create isolated test databases
        env:
          PGPASSWORD: ci-only-test-password
        run: |
          for database in astracalls_restaurant_test astracalls_meta_test astracalls_tenant_prototype_test astracalls_channels_prototype_test astracalls_oauth_refresh_test astracalls_identity_test; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test core checkout browser flow
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -v ./cmd/server -run '^TestPlatformOrderNodeSignatureCompatibility$'

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Test tenant with PostgreSQL
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
        working-directory: prototype/tenant

      - name: Test platform with PostgreSQL
        run: npm test
        working-directory: prototype/platform

      - name: Test installer and source packaging
        run: python3 -m unittest discover -s deploy -p 'test_*.py'

      - name: Preserve synthetic customer support rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-customer-support-${{ github.sha }}
          path: artifacts/customer-support/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve synthetic delivery location rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-delivery-location-${{ github.sha }}
          path: artifacts/delivery-location/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve synthetic provisioning queue rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-provisioning-queue-${{ github.sha }}
          path: artifacts/provisioning/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve synthetic payment-method rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-payment-methods-${{ github.sha }}
          path: artifacts/payment-methods/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve synthetic opening-schedule rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-opening-schedule-${{ github.sha }}
          path: artifacts/opening-schedule/*.png
          if-no-files-found: ignore
          retention-days: 7

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install pinned browser-test dependencies
        run: npm ci --prefix ../prototype/platform

      - name: Verify compiled storefront opening-state behavior
        run: node --import tsx ../prototype/platform/integration/storefront-opening-check.mjs

      - name: Preserve synthetic storefront opening rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-storefront-opening-${{ github.sha }}
          path: artifacts/storefront-opening/*.png
          if-no-files-found: ignore
          retention-days: 7

  native-windows:
    name: native-windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: "true"
      BOT: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned official Flutter SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flutter-3.47.5.zip'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.5-stable.zip' -OutFile $archive -TimeoutSec 600
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '0ccd71931f49c2fbe394b1eeb6d79af3d624058a043ea0d03d34160581624fb8') { throw 'Flutter SDK checksum mismatch' }
          $sdk = Join-Path $env:RUNNER_TEMP 'onlinu-sdk'
          7z x $archive "-o$sdk" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed' }
          (Join-Path $sdk 'flutter\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore locked native dependencies
        working-directory: prototype/admin_flutter
        run: |
          flutter --suppress-analytics --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter --suppress-analytics pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- pubspec.lock windows/flutter/generated_plugin_registrant.cc windows/flutter/generated_plugins.cmake
      - name: Analyze and test native client
        working-directory: prototype/admin_flutter
        run: |
          dart --suppress-analytics format --output=none --set-exit-if-changed lib test integration_test integration_http
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter --suppress-analytics analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter --suppress-analytics test --no-pub --reporter expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows OS storage and native renderer
        working-directory: prototype/admin_flutter
        timeout-minutes: 12
        env:
          ONLINU_SMOKE_SCREENSHOT: ${{ github.workspace }}/prototype/admin_flutter/build/native-smoke/windows-orders.png
        run: flutter --suppress-analytics test integration_test/windows_smoke_test.dart -d windows --no-pub --reporter expanded
      - name: Retain synthetic Windows rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-windows-rendering-${{ github.sha }}
          path: prototype/admin_flutter/build/native-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build unsigned native core smoke bundle
        working-directory: prototype/admin_flutter
        # Reserved .invalid origin: build verification, not a deployable release.
        run: flutter --suppress-analytics build windows --release --no-pub --dart-define=CORE_API_BASE_URL=https://control.invalid
      - name: Retain unsigned smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-windows-unsigned-smoke-${{ github.sha }}
          path: prototype/admin_flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7

  runtime-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: astracalls_identity_test
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d astracalls_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      IDENTITY_TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/astracalls_identity_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node for isolated cancellation acceptance
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated journal fixture dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototype/platform
      - name: Build the original codec-bearing runtime image
        timeout-minutes: 35
        run: docker build --tag "onlinu-runtime-smoke:$GITHUB_SHA" .
      - name: Exercise isolated runtime image
        run: bash integration/runtime-image-smoke.sh "onlinu-runtime-smoke:$GITHUB_SHA"
      - name: Exercise two isolated rendered tenant fixtures
        run: python3 integration/tenant-compose-smoke.py "onlinu-runtime-smoke:$GITHUB_SHA"
      - name: Exercise owned client cancellation against daemon state
        run: node integration/provisioning-cancellation-smoke.mjs "onlinu-runtime-smoke:$GITHUB_SHA"
      - name: Exercise real journal and disposable Docker tenant lifecycle
        run: node prototype/platform/integration/provisioning-docker-check.mjs "onlinu-runtime-smoke:$GITHUB_SHA"
      - name: Upload non-secret acceptance report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-runtime-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/onlinu-runtime-image-report.json
            ${{ runner.temp }}/onlinu-tenant-compose-report.json
            ${{ runner.temp }}/onlinu-provisioning-cancellation-report.json
            ${{ runner.temp }}/onlinu-journal-docker-report.json
          if-no-files-found: error
          retention-days: 7

  android-compile:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.android_smoke || inputs.android_execute || inputs.android_accelerated) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ONLINU_ANDROID_EXECUTE: ${{ (inputs.android_execute || inputs.android_accelerated) && '1' || '0' }}
      ONLINU_ANDROID_ACCELERATION: ${{ inputs.android_accelerated && 'kvm' || 'software' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated smoke guards
        run: python3 -m unittest discover -s deploy -p 'test_android_native_smoke.py' -v
      - name: Install reviewed official Flutter SDK
        run: |
          archive="$RUNNER_TEMP/flutter-linux-3.47.5.tar.xz"
          curl -fsSL --retry 2 --max-time 600 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz -o "$archive"
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/onlinu-android-sdk"
          tar -xJf "$archive" -C "$RUNNER_TEMP/onlinu-android-sdk"
          echo "ONLINU_FLUTTER_SDK=$RUNNER_TEMP/onlinu-android-sdk/flutter" >> "$GITHUB_ENV"
      - name: Grant specifically approved temporary KVM access
        if: ${{ inputs.android_accelerated }}
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test "$(id -u)" -ne 0
          backup="$RUNNER_TEMP/onlinu-kvm-original.acl"
          test ! -e "$backup"
          umask 077
          getfacl -cn /dev/kvm > "$backup"
          python3 - "$backup" <<'PY'
          import pathlib, sys
          entries = [line.strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          if sorted(entries) != ['group::rw-', 'other::---', 'user::rw-']:
              raise SystemExit('Unexpected KVM ACL; no permission change attempted.')
          PY
          touch "$RUNNER_TEMP/onlinu-kvm-grant-attempted"
          sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build isolated debug Android application
        run: python3 integration/android-native-smoke.py
      - name: Restore and verify original KVM permissions
        if: ${{ always() && inputs.android_accelerated }}
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/onlinu-kvm-grant-attempted"; then
            sudo -n setfacl --set-file="$RUNNER_TEMP/onlinu-kvm-original.acl" /dev/kvm
            getfacl -cn /dev/kvm > "$RUNNER_TEMP/onlinu-kvm-restored.acl"
            cmp "$RUNNER_TEMP/onlinu-kvm-original.acl" "$RUNNER_TEMP/onlinu-kvm-restored.acl"
            echo 'Original KVM permissions restored and verified.'
          fi
      - name: Retain non-production debug build and report
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-android-smoke-${{ github.sha }}
          path: artifacts/android-native/
          if-no-files-found: error
          retention-days: 3

  ios-compile:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.ios_smoke || inputs.ios_execute) }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ONLINU_IOS_EXECUTE: ${{ inputs.ios_execute && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated iOS smoke guards
        run: python3 -m unittest discover -s deploy -p 'test_ios_native_smoke.py' -v
      - name: Install reviewed official Flutter SDK
        run: |
          case "$(uname -m)" in
            arm64)
              file=flutter_macos_arm64_3.47.5-stable.zip
              expected=d4dd908b5f8f65515831b6d68ae33307a813f2b68947dded7a1994ee5ea7cead
              ;;
            x86_64)
              file=flutter_macos_3.47.5-stable.zip
              expected=a7893bb0feecd8bd066f4f7e850356f896a6fc3b862e6c506d21c76691a66b72
              ;;
            *) echo 'Unsupported standard macOS runner architecture'; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$file"
          curl -fsSL --retry 2 --max-time 600 "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$file" -o "$archive"
          echo "$expected  $archive" | shasum -a 256 --check -
          mkdir "$RUNNER_TEMP/onlinu-ios-sdk"
          ditto -x -k "$archive" "$RUNNER_TEMP/onlinu-ios-sdk"
          echo "ONLINU_FLUTTER_SDK=$RUNNER_TEMP/onlinu-ios-sdk/flutter" >> "$GITHUB_ENV"
      - name: Build isolated iOS Simulator application
        run: python3 integration/ios-native-smoke.py
      - name: Retain non-production Simulator build and report
        uses: actions/upload-artifact@v4
        with:
          name: onlinu-ios-smoke-${{ github.sha }}
          path: artifacts/ios-native/
          if-no-files-found: error
          retention-days: 3
